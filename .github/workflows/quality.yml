name: Takosumi OSS quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: takosumi-oss-quality-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  quality:
    name: check and test
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pinned: v6.0.2 (2026)
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # pinned: v2.0.2
        with:
          # Keep the portable gate on the same runtime as runner-image-proof.yml.
          bun-version: "1.4.0"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # pinned: v4.4.0 (2026)
        with:
          node-version: "22"

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@847eaa4afeb791b06daa46e8eafa8b1b68d7cfb4 # pinned: v2
        with:
          tofu_version: 1.12.1
          tofu_wrapper: false

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Install locked dashboard dependencies
        working-directory: dashboard
        run: bun install --frozen-lockfile

      - name: Install locked docs dependencies
        working-directory: docs
        run: npm ci --no-audit --no-fund

      - name: Diagnose runner image release action
        run: |
          bun run check > /tmp/diag-test.log 2>&1 || true
          grep -E 'DIAG_BODY|\(fail\)|^ *[0-9]+ (pass|fail)$' /tmp/diag-test.log | head -60
          ls -la /tmp/takosumi-runs 2>&1 | head -20
