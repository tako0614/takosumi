name: Takosumi OSS dependency audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: takosumi-oss-dependency-audit-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  dependency-audit:
    name: audit locked dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pinned: v6.0.2 (2026)
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine dependency audit scope
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          required=true
          if [[ "$EVENT_NAME" == "pull_request" || "$EVENT_NAME" == "push" ]]; then
            required=false
            diff_file="$RUNNER_TEMP/takosumi-dependency-audit-paths"
            range=""

            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              range="$BASE_SHA...$HEAD_SHA"
            elif [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
              required=true
            else
              range="$BEFORE_SHA..$HEAD_SHA"
            fi

            if [[ "$required" == "false" ]]; then
              if ! git diff --name-only -z --no-renames "$range" > "$diff_file"; then
                required=true
              else
                while IFS= read -r -d '' path; do
                  case "$path" in
                    package.json|bun.lock|package-lock.json|npm-shrinkwrap.json|bunfig.toml|.npmrc|*/package.json|*/bun.lock|*/package-lock.json|*/npm-shrinkwrap.json|*/bunfig.toml|*/.npmrc|scripts/run-bun-audit.ts|.github/workflows/dependency-audit.yml)
                      required=true
                      break
                      ;;
                  esac
                done < "$diff_file"
              fi
            fi
          fi

          printf 'required=%s\n' "$required" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        if: steps.scope.outputs.required == 'true'
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # pinned: v2.0.2
        with:
          bun-version: 1.3.14

      - name: Setup Node
        if: steps.scope.outputs.required == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # pinned: v4.4.0 (2026)
        with:
          node-version: "22"

      - name: Audit root JavaScript dependencies
        if: steps.scope.outputs.required == 'true'
        run: bun scripts/run-bun-audit.ts

      - name: Audit dashboard JavaScript dependencies
        if: steps.scope.outputs.required == 'true'
        run: bun scripts/run-bun-audit.ts --cwd dashboard

      - name: Audit docs JavaScript dependencies
        if: steps.scope.outputs.required == 'true'
        run: npm audit --prefix docs --audit-level=moderate

      - name: Audit website JavaScript dependencies
        if: steps.scope.outputs.required == 'true'
        run: npm audit --prefix website --audit-level=moderate
