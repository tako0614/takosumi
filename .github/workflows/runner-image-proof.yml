name: runner proof

# Build once, run both the hardened publication smoke and native HTTP Plan/Apply
# proof against that image, then hand off those exact bytes and their provenance.
# This workflow never publishes an image or changes a running deployment. The
# operator's existing `takosumi-runner-image build` remains publication authority.
#
# Product pull requests and pushes use the portable `bun run check` gate in
# quality.yml. This Docker proof is a separate native-toolchain cadence, run
# weekly or explicitly when runner-image evidence needs to be refreshed.

on:
  schedule:
    # Weekly (Monday 06:00 UTC) to catch base-image / OpenTofu / provider drift.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runner-proof-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  prove-runner-docker:
    name: prove and export exact Runner image
    runs-on: ubuntu-latest
    # The provider-mirror layer (now including the large hashicorp/aws provider)
    # dominates build time; allow generous headroom over the script's ~10-minute
    # estimate plus the run/plan/apply E2E.
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pinned: v6.0.2 (2026)
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # pinned: v2.0.2
        with:
          bun-version: "1.4.0"

      - name: Install locked source dependencies
        run: bun install --frozen-lockfile

      # Docker 28's classic store cannot carry the manifest descriptor consumed
      # by the publisher. Use the same pinned engine/store contract on both sides.
      - name: Setup descriptor-preserving Docker
        uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1 # v5.4.0
        with:
          version: v29.1.3
          set-host: true
          daemon-config: |
            {"features":{"containerd-snapshotter":true}}

      - name: Setup OpenTofu signature verifier
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Show docker version
        run: docker version

      - name: Build once and prove the exact native image
        id: candidate
        run: >-
          bun scripts/runner-image-native-candidate.ts
          --output-dir "$RUNNER_TEMP/runner-native-candidate"

      - name: Attest the image archive and proof record together
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/runner-native-candidate/runner-image.tar
            ${{ runner.temp }}/runner-native-candidate/candidate.json
          push-to-registry: false

      - name: Retain the offline verification bundle
        id: bundle
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: >-
          cp -- "$ATTESTATION_BUNDLE"
          "$RUNNER_TEMP/runner-native-candidate/attestation.jsonl"

      - name: Upload the immutable candidate handoff
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runner-native-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/runner-native-candidate/runner-image.tar
            ${{ runner.temp }}/runner-native-candidate/candidate.json
            ${{ runner.temp }}/runner-native-candidate/attestation.jsonl
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
          overwrite: false
