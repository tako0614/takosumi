name: Build signed standard Form host reports

on:
  workflow_dispatch:
    inputs:
      takoform_commit:
        description: Exact reviewed Takoform main commit containing ga-core-v1
        required: true
        type: string

run-name: standard-form-host-report:${{ github.sha }}

concurrency:
  group: standard-form-host-report-${{ github.sha }}-${{ inputs.takoform_commit }}
  cancel-in-progress: false

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  EXPECTED_COSIGN_VERSION: "v3.0.6"
  REPORT_IDENTITY: https://github.com/tako0614/takosumi/.github/workflows/standard-form-host-report.yml@refs/heads/main

jobs:
  generate:
    name: Execute the in-process reference host
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      source_commit: ${{ steps.source.outputs.source_commit }}
      source_commit_short: ${{ steps.source.outputs.source_commit_short }}
      takoform_source_commit: ${{ steps.source.outputs.takoform_source_commit }}
    steps:
      - name: Check out the exact Takosumi main source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Bind this one-attempt run to protected main
        id: source
        shell: bash
        env:
          TAKOFORM_COMMIT: ${{ inputs.takoform_commit }}
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse refs/remotes/origin/main)" = "${GITHUB_SHA}"
          [[ "${TAKOFORM_COMMIT}" =~ ^[0-9a-f]{40}$ ]]
          {
            echo "source_commit=${GITHUB_SHA}"
            echo "source_commit_short=${GITHUB_SHA:0:12}"
            echo "takoform_source_commit=${TAKOFORM_COMMIT}"
          } >> "${GITHUB_OUTPUT}"

      - name: Check out the exact reviewed Takoform source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: tako0614/terraform-provider-takoform
          ref: ${{ steps.source.outputs.takoform_source_commit }}
          path: takoform-source
          fetch-depth: 1
          persist-credentials: false

      - name: Verify the Takoform commit is current public main history
        shell: bash
        env:
          TAKOFORM_COMMIT: ${{ steps.source.outputs.takoform_source_commit }}
        run: |
          set -euo pipefail
          test "$(git -C takoform-source rev-parse HEAD)" = "${TAKOFORM_COMMIT}"
          git -C takoform-source fetch --no-tags origin main
          git -C takoform-source merge-base --is-ancestor "${TAKOFORM_COMMIT}" refs/remotes/origin/main
          test -z "$(git -C takoform-source status --porcelain=v1 --untracked-files=all)"
          printf '/takoform-source/\n' >> .git/info/exclude
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.14

      - name: Install the exact Takosumi dependency graph
        run: bun install --frozen-lockfile

      - name: Execute and revalidate all ten exact Form lifecycles
        shell: bash
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.source_commit }}
          TAKOFORM_COMMIT: ${{ steps.source.outputs.takoform_source_commit }}
        run: |
          set -euo pipefail
          output="${RUNNER_TEMP}/host-report-candidate"
          bun run service-form:host-report -- build \
            --takoform-root "${GITHUB_WORKSPACE}/takoform-source" \
            --output-dir "${output}" \
            --source-commit "${SOURCE_COMMIT}" \
            --takoform-source-commit "${TAKOFORM_COMMIT}"
          bun run service-form:host-report -- verify-unsigned \
            --output-dir "${output}" \
            --source-commit "${SOURCE_COMMIT}" \
            --takoform-source-commit "${TAKOFORM_COMMIT}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test -z "$(git -C takoform-source status --porcelain=v1 --untracked-files=all)"

      - name: Upload the exact unsigned closure
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: takosumi-standard-form-host-report-unsigned-${{ steps.source.outputs.source_commit_short }}
          path: ${{ runner.temp }}/host-report-candidate/
          if-no-files-found: error
          retention-days: 1

  sign:
    name: Authenticate the exact host-report subjects
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: generate
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the exact report tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.generate.outputs.source_commit }}
          fetch-depth: 1
          persist-credentials: false

      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.14

      - name: Install the exact report tooling dependency graph
        run: bun install --frozen-lockfile

      - name: Download only this run's immutable artifact id
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.generate.outputs.artifact_id }}
          path: candidate
          digest-mismatch: error

      - name: Revalidate before granting signing authority
        shell: bash
        env:
          ARTIFACT_DIGEST: ${{ needs.generate.outputs.artifact_digest }}
          SOURCE_COMMIT: ${{ needs.generate.outputs.source_commit }}
          TAKOFORM_COMMIT: ${{ needs.generate.outputs.takoform_source_commit }}
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          [[ "${ARTIFACT_DIGEST}" =~ ^(sha256:)?[0-9a-f]{64}$ ]]
          test "$(git rev-parse HEAD)" = "${SOURCE_COMMIT}"
          bun run service-form:host-report -- verify-unsigned \
            --output-dir candidate \
            --source-commit "${SOURCE_COMMIT}" \
            --takoform-source-commit "${TAKOFORM_COMMIT}"

      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2, Cosign v3.0.6

      - name: Sign every canonical host report
        shell: bash
        run: |
          set -euo pipefail
          grep -F "${EXPECTED_COSIGN_VERSION}" <<<"$(cosign version 2>&1)"
          while IFS= read -r report; do
            bundle="${report%.json}.sigstore.json"
            cosign sign-blob "candidate/${report}" --bundle "candidate/${bundle}" --yes
            cosign verify-blob "candidate/${report}" --bundle "candidate/${bundle}" \
              --certificate-identity "${REPORT_IDENTITY}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
          done < <(bun -e 'const m=await Bun.file("candidate/host-report-manifest.json").json(); for (const r of m.reports) console.log(r.path)')

      - name: Finalize and verify the signed closure
        shell: bash
        env:
          SOURCE_COMMIT: ${{ needs.generate.outputs.source_commit }}
          TAKOFORM_COMMIT: ${{ needs.generate.outputs.takoform_source_commit }}
        run: |
          set -euo pipefail
          bun run service-form:host-report -- finalize \
            --output-dir candidate \
            --source-commit "${SOURCE_COMMIT}" \
            --takoform-source-commit "${TAKOFORM_COMMIT}" \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --workflow-run-attempt "${GITHUB_RUN_ATTEMPT}"
          bun run service-form:host-report -- verify-signed \
            --output-dir candidate \
            --source-commit "${SOURCE_COMMIT}" \
            --takoform-source-commit "${TAKOFORM_COMMIT}" \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --workflow-run-attempt "${GITHUB_RUN_ATTEMPT}"

      - name: Upload the signed host-report candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: takosumi-standard-form-host-report-candidate-${{ needs.generate.outputs.source_commit_short }}
          path: candidate/
          if-no-files-found: error
          retention-days: 90
