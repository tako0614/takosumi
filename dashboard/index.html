<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Takosumi</title>
    <meta
      name="description"
      content="Takosumi dashboard for hosting services with connected provider credentials."
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#f6f7f9" />
    <link rel="icon" type="image/png" href="/tako.png" />
    <link rel="apple-touch-icon" href="/tako.png" />
    <script src="/assets/theme-init.js"></script>
    <style>
      /* Pre-hydration flash guard — must match tokens.css --tg-bg / --tg-fg
         exactly (light + dark) so there is no color jump when the stylesheet
         loads. */
      html,
      body {
        margin: 0;
        background: #f7f7f8;
        color: #18181b;
      }
      html[data-theme="dark"],
      html[data-theme="dark"] body {
        background: #0a0a0b;
        color: #f5f5f6;
      }

      /* Capability discovery is intentionally complete before the SPA mounts,
         so composed routes cannot freeze on the wrong product fallback. Keep
         that boundary visible instead of leaving the document blank while it
         is in flight. */
      #dashboard-boot-loading {
        min-height: 100vh;
        display: grid;
        place-items: center;
        gap: 0.75rem;
        align-content: center;
        font: 500 0.95rem/1.4 system-ui, sans-serif;
        color: inherit;
      }
      #dashboard-boot-loading::before {
        content: "";
        width: 1.5rem;
        height: 1.5rem;
        border: 2px solid currentColor;
        border-right-color: transparent;
        border-radius: 50%;
        animation: dashboard-boot-spin 0.8s linear infinite;
      }
      @keyframes dashboard-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #dashboard-boot-loading::before {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="dashboard-boot-loading" role="status" aria-live="polite">
        読み込み中…
      </div>
    </div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
