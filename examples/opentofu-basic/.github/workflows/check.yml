name: Portable OpenTofu sample check

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "*.tf"
      - package.json
      - .github/workflows/check.yml

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pinned: v6.0.2 (2026)
        with:
          persist-credentials: false

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@847eaa4afeb791b06daa46e8eafa8b1b68d7cfb4 # pinned: v2
        with:
          tofu_version: 1.12.1
          tofu_wrapper: false

      - name: Validate portable sample
        run: |
          tofu fmt -check
          tofu init -backend=false
          tofu validate
