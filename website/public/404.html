<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#0a0a0b" />
  <title>Takosumi</title>
  <link rel="icon" type="image/png" href="/tako.png" />
  <script src="/theme-init.js"></script>
  <style>
    /* The landing bundles this face through Vite; the static 404 page loads the same file directly. */
    @font-face { font-family: "Bricolage Grotesque Variable"; font-style: normal; font-display: swap; font-weight: 200 800; src: url(/fonts/bricolage-grotesque-latin-wght-normal.woff2) format("woff2"); }
    :root { color-scheme: dark; --bg: #0a0a0b; --surface-2: #1c1c1f; --ink: #f5f5f6; --muted: #a1a1a8; --line: #262629; --red: #d63a2f; --red-hover: #c93025; --accent-text: #ff8b83; }
    :root[data-theme='light'] { color-scheme: light; --bg:#f7f7f8; --surface-2:#f1f1f3; --ink:#18181b; --muted:#66666f; --line:#e6e6e9; --red:#d32f24; --red-hover:#c42f24; --accent-text:#c42f24; }
    @media (prefers-color-scheme:light) { :root:not([data-theme]) { color-scheme: light; --bg:#f7f7f8; --surface-2:#f1f1f3; --ink:#18181b; --muted:#66666f; --line:#e6e6e9; --red:#d32f24; --red-hover:#c42f24; --accent-text:#c42f24; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font-family: "Bricolage Grotesque Variable", "Bricolage Grotesque", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", sans-serif; line-height: 1.55; -webkit-font-smoothing: antialiased; }
    header, main, footer { width: min(calc(100% - 32px), 1180px); margin-inline: auto; }
    header { min-height: 76px; display: flex; align-items: center; }
    header a { display: inline-flex; align-items: center; gap: 10px; color: var(--ink); font-size: 1.14rem; font-weight: 650; letter-spacing: -.04em; text-decoration: none; }
    header img { width: 32px; height: 32px; border-radius: 7px; }
    main { margin-block: auto; padding-block: 72px; }
    .error-code { margin: 0 0 12px; color: var(--accent-text); font-size: .9rem; font-weight: 650; }
    h1 { margin: 0; font-size: clamp(1.75rem, 4vw, 2.4rem); font-weight: 680; letter-spacing: -.03em; line-height: 1.3; }
    p { margin: 16px 0 28px; color: var(--muted); line-height: 1.75; }
    nav { display: flex; gap: 12px 24px; flex-wrap: wrap; align-items: center; }
    nav a { color: var(--ink); font-size: .875rem; font-weight: 650; text-decoration: none; }
    nav a:hover { color: var(--accent-text); }
    nav a.primary { display: inline-flex; align-items: center; min-height: 48px; padding: 12px 24px; border-radius: 999px; background: var(--red); color: white; }
    nav a.primary:hover { background: var(--red-hover); color: white; }
    a:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 4px; }
    footer { border-top: 1px solid var(--line); padding-block: 24px 40px; color: var(--muted); font-size: .8rem; }
  </style>
</head>
<body>
  <header><a href="/" aria-label="Takosumi ホーム"><img src="/tako.png" alt="" width="32" height="32" />Takosumi</a></header>
  <main>
    <p class="error-code">404</p>
    <h1>ページが見つかりません</h1>
    <p>ページが移動したか、URL が違うようです。</p>
    <nav aria-label="移動先"><a class="primary" href="/">ホームへ戻る</a><a href="/#apps">アプリを選ぶ</a><a href="/docs/">ドキュメント</a></nav>
  </main>
  <footer>公開されたオープンソースを、アプリのように入れて使う。</footer>
</body>
</html>
