<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#0a0a0b" />
  <title>Takosumi</title>
  <link rel="icon" type="image/png" href="/tako.png" />
  <script src="/theme-init.js"></script>
  <style>
    :root { color-scheme: dark; --bg: #0a0a0b; --surface: #151517; --ink: #f5f5f6; --muted: #a1a1a8; --line: #262629; --red: #d63a2f; --accent-text: #ff8b83; }
    :root[data-theme='light'] { color-scheme: light; --bg:#f7f7f8; --surface:#fff; --ink:#18181b; --muted:#52525b; --line:#e4e4e7; --accent-text:#b91c1c; }
    @media (prefers-color-scheme:light) { :root:not([data-theme]) { color-scheme: light; --bg:#f7f7f8; --surface:#fff; --ink:#18181b; --muted:#52525b; --line:#e4e4e7; --accent-text:#b91c1c; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font-family: "Bricolage Grotesque", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", sans-serif; }
    header, main, footer { width: min(calc(100% - 32px), 1180px); margin-inline: auto; }
    header { min-height: 76px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); font-weight: 800; }
    header img { width: 30px; height: 30px; border-radius: 7px; }
    main { margin-block: auto; padding-block: 90px; }
    h1 { font-size: clamp(3.8rem, 11vw, 8rem); line-height: 1; letter-spacing: -.06em; margin: 0; }
    .error-code { margin: 0 0 20px; color: var(--accent-text); font-size: .86rem; font-weight: 700; }
    p { color: var(--muted); font-size: 1.1rem; line-height: 1.7; margin: 24px 0 30px; }
    nav { display: flex; gap: 16px 24px; flex-wrap: wrap; align-items: center; }
    a { color: var(--ink); font-weight: 700; text-decoration: none; }
    a.primary { background: var(--red); color: white; padding: 12px 18px; border-radius: 8px; }
    a:hover { text-decoration: underline; }
    a:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 4px; }
    footer { border-top: 1px solid var(--line); padding-block: 24px; color: var(--muted); font-size: .82rem; }
  </style>
</head>
<body>
  <header><img src="/tako.png" alt="" />Takosumi</header>
  <main>
    <p class="error-code">404 / ページが見つかりません</p>
    <h1>Takosumi</h1>
    <p>ページが移動したか、URL が違うようです。</p>
    <nav><a class="primary" href="/">ホームへ戻る ↗</a><a href="/docs/">ドキュメント ↗</a></nav>
  </main>
  <footer>Git で公開されたアプリを、自分の環境へ。</footer>
</body>
</html>
