# Takosumi Accounts — Bun + Postgres reference stack.
#
# Brings up Takosumi Accounts as a Bun service backed by Postgres,
# fronted by Caddy for TLS termination. Mirrors the Cloudflare Workers
# reference distribution but runs anywhere a Docker daemon does (single
# VM, container host, k8s with kompose, etc.).
#
# Hardening defaults:
#   - `accounts` and `migrations` run as the non-root `bun` user shipped
#     by `oven/bun:1.3.14` (`USER bun` in the Dockerfile, uid/gid
#     1000:1000). `user:` is repeated here so an operator who swaps the
#     base image still gets a non-root runtime.
#   - `accounts` mounts the root filesystem read-only with a tmpfs at
#     `/tmp` for runtime pid files and any temporary archive material.
#   - `cap_drop: [ALL]` removes every Linux capability the service grants
#     containers by default; the accounts service only needs to bind to
#     an unprivileged TCP port (>=1024) inside the docker network.
#   - `security_opt: ["no-new-privileges:true"]` prevents setuid/setgid
#     binaries inside the container from escalating, even on misconfigured
#     hosts where the seccomp profile is permissive.

x-node-postgres-build: &node-postgres-build
  context: ../..
  dockerfile: deploy/node-postgres/Dockerfile

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: takosumi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: takosumi_accounts
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U takosumi -d takosumi_accounts"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrations:
    # Applies both schemas the composed server reads, once, before the
    # accounts service is allowed to start: the control-plane ledger
    # (../../core/scripts/db-migrate.ts, forward-only) and then
    # `takosumi accounts migrate` (../../cli/src/cli-accounts-db.ts). Both
    # live in the same database. The container exits 0 on success, after
    # which compose promotes `accounts` from waiting to running.
    #
    build: *node-postgres-build
    restart: "no"
    user: "1000:1000"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://takosumi:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/takosumi_accounts
      TAKOSUMI_ACCOUNTS_DATABASE_URL: postgres://takosumi:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/takosumi_accounts
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        bun /app/core/scripts/db-migrate.ts --env=production
        bun /app/cli/src/main.ts accounts migrate

  accounts:
    build: *node-postgres-build
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    # Compose reads .env for interpolation; only the settings below reach this
    # service. Add arbitrary upstream clientSecretEnv bindings individually in
    # docker-compose.override.yml (see README.md), never via a whole env_file.
    environment:
      TAKOSUMI_ACCOUNTS_ISSUER: ${TAKOSUMI_ACCOUNTS_ISSUER:-https://app.example.com}
      TAKOSUMI_ACCOUNTS_BIND_HOST: ${TAKOSUMI_ACCOUNTS_BIND_HOST:-0.0.0.0}
      TAKOSUMI_ACCOUNTS_DATABASE_URL: postgres://takosumi:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/takosumi_accounts
      TAKOSUMI_ACCOUNTS_CLIENTS: ${TAKOSUMI_ACCOUNTS_CLIENTS:-}
      TAKOSUMI_ACCOUNTS_CLIENT_ID: ${TAKOSUMI_ACCOUNTS_CLIENT_ID:-}
      TAKOSUMI_ACCOUNTS_REDIRECT_URIS: ${TAKOSUMI_ACCOUNTS_REDIRECT_URIS:-}
      TAKOSUMI_ACCOUNTS_CLIENT_SECRET: ${TAKOSUMI_ACCOUNTS_CLIENT_SECRET:-}
      TAKOSUMI_ACCOUNTS_CLIENT_AUTH_METHOD: ${TAKOSUMI_ACCOUNTS_CLIENT_AUTH_METHOD:-}
      TAKOSUMI_ACCOUNTS_ALLOWED_SCOPES: ${TAKOSUMI_ACCOUNTS_ALLOWED_SCOPES:-}
      TAKOSUMI_ACCOUNTS_PG_POOL_MAX: ${TAKOSUMI_ACCOUNTS_PG_POOL_MAX:-}
      TAKOSUMI_ACCOUNTS_PG_IDLE_TIMEOUT_MS: ${TAKOSUMI_ACCOUNTS_PG_IDLE_TIMEOUT_MS:-}
      TAKOSUMI_ACCOUNTS_PG_CONNECT_TIMEOUT_MS: ${TAKOSUMI_ACCOUNTS_PG_CONNECT_TIMEOUT_MS:-}
      TAKOSUMI_ACCOUNTS_PG_STATEMENT_TIMEOUT_MS: ${TAKOSUMI_ACCOUNTS_PG_STATEMENT_TIMEOUT_MS:-}
      TAKOSUMI_ACCOUNTS_PG_SSL_MODE: ${TAKOSUMI_ACCOUNTS_PG_SSL_MODE:-}
      TAKOSUMI_ACCOUNTS_PG_SSL_ROOT_CERT: ${TAKOSUMI_ACCOUNTS_PG_SSL_ROOT_CERT:-}
      TAKOSUMI_ACCOUNTS_PORT: ${TAKOSUMI_ACCOUNTS_PORT:-8787}
      TAKOSUMI_ACCOUNTS_ES256_PRIVATE_JWK: ${TAKOSUMI_ACCOUNTS_ES256_PRIVATE_JWK:-}
      TAKOSUMI_ACCOUNTS_ES256_KEY_ID: ${TAKOSUMI_ACCOUNTS_ES256_KEY_ID:-}
      TAKOSUMI_ACCOUNTS_ES256_PREVIOUS_PUBLIC_JWKS: ${TAKOSUMI_ACCOUNTS_ES256_PREVIOUS_PUBLIC_JWKS:-}
      TAKOSUMI_ACCOUNTS_OIDC_PAIRWISE_SUBJECT_SECRET: ${TAKOSUMI_ACCOUNTS_OIDC_PAIRWISE_SUBJECT_SECRET:-}
      TAKOSUMI_ACCOUNTS_SUBJECT: ${TAKOSUMI_ACCOUNTS_SUBJECT:-}
      TAKOSUMI_SECRET_STORE_PASSPHRASE: ${TAKOSUMI_SECRET_STORE_PASSPHRASE:-}
      TAKOSUMI_ACCOUNT_SESSION_HASH_SALT: ${TAKOSUMI_ACCOUNT_SESSION_HASH_SALT:-}
      TAKOSUMI_DEPLOY_CONTROL_TOKEN: ${TAKOSUMI_DEPLOY_CONTROL_TOKEN:-}
      TAKOSUMI_MOBILE_OIDC_CLIENT_ID: ${TAKOSUMI_MOBILE_OIDC_CLIENT_ID:-}
      TAKOSUMI_ACCOUNTS_PASSKEY_RP_ID: ${TAKOSUMI_ACCOUNTS_PASSKEY_RP_ID:-}
      TAKOSUMI_ACCOUNTS_PASSKEY_RP_NAME: ${TAKOSUMI_ACCOUNTS_PASSKEY_RP_NAME:-}
      TAKOSUMI_ACCOUNTS_PASSKEY_RP_ORIGIN: ${TAKOSUMI_ACCOUNTS_PASSKEY_RP_ORIGIN:-}
      TAKOSUMI_ACCOUNTS_PASSKEY_TTL_SECONDS: ${TAKOSUMI_ACCOUNTS_PASSKEY_TTL_SECONDS:-}
      TAKOSUMI_ACCOUNTS_PASSKEY_SESSION_TTL_MS: ${TAKOSUMI_ACCOUNTS_PASSKEY_SESSION_TTL_MS:-}
      TAKOSUMI_ACCOUNTS_SUBJECT_SECRET: ${TAKOSUMI_ACCOUNTS_SUBJECT_SECRET:-}
      TAKOSUMI_ACCOUNTS_UPSTREAM_SESSION_TTL_MS: ${TAKOSUMI_ACCOUNTS_UPSTREAM_SESSION_TTL_MS:-}
      TAKOSUMI_ACCOUNTS_UPSTREAM_PROVIDERS: ${TAKOSUMI_ACCOUNTS_UPSTREAM_PROVIDERS:-}
      TAKOSUMI_ACCOUNTS_WORKLOAD_PLATFORM_SERVICE_RESOLVER_TOKEN: ${TAKOSUMI_ACCOUNTS_WORKLOAD_PLATFORM_SERVICE_RESOLVER_TOKEN:-}
      TAKOSUMI_ACCOUNTS_WORKLOAD_PLATFORM_SERVICES_INTERNAL_URL: ${TAKOSUMI_ACCOUNTS_WORKLOAD_PLATFORM_SERVICES_INTERNAL_URL:-}
      TAKOSUMI_ACCOUNTS_WORKLOAD_PLATFORM_SERVICES_ALLOW_DIRECT_DEPLOY_CONTROL: ${TAKOSUMI_ACCOUNTS_WORKLOAD_PLATFORM_SERVICES_ALLOW_DIRECT_DEPLOY_CONTROL:-}
      TAKOSUMI_ACCOUNTS_BILLING_PORTAL_URL: ${TAKOSUMI_ACCOUNTS_BILLING_PORTAL_URL:-}
      TAKOSUMI_ACCOUNTS_PRIVACY_OPERATIONS_TOKEN: ${TAKOSUMI_ACCOUNTS_PRIVACY_OPERATIONS_TOKEN:-}
      TAKOSUMI_ACCOUNTS_LOGIN_EMAIL_ALLOWLIST: ${TAKOSUMI_ACCOUNTS_LOGIN_EMAIL_ALLOWLIST:-}
      TAKOSUMI_ACCOUNTS_LOGIN_EMAIL_ALLOWLIST_REQUIRE_VERIFIED: ${TAKOSUMI_ACCOUNTS_LOGIN_EMAIL_ALLOWLIST_REQUIRE_VERIFIED:-}
      TAKOSUMI_ACCOUNTS_PLATFORM_ACCESS: ${TAKOSUMI_ACCOUNTS_PLATFORM_ACCESS:-}
      TAKOSUMI_ACCOUNTS_PRIVACY_RETENTION_POLICY_REF: ${TAKOSUMI_ACCOUNTS_PRIVACY_RETENTION_POLICY_REF:-}
      TAKOSUMI_CONNECTION_OAUTH_STATE_SECRET: ${TAKOSUMI_CONNECTION_OAUTH_STATE_SECRET:-}
    expose:
      - "8787"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'bun -e ''await fetch("http://127.0.0.1:8787/healthz").then((r)=>{if(!r.ok)throw new Error(String(r.status))})''',
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      accounts:
        condition: service_healthy
    environment:
      # Caddyfile.example dereferences `{$TAKOSUMI_ACCOUNTS_PUBLIC_HOSTNAME}`
      # for the site label, which is the public hostname users dial.
      # Operators must set this before running `docker compose up` so
      # Caddy provisions the correct certificate over ACME.
      TAKOSUMI_ACCOUNTS_PUBLIC_HOSTNAME: ${TAKOSUMI_ACCOUNTS_PUBLIC_HOSTNAME:-app.example.com}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.example:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
