id: takoform
display_name: Takoform Service Form host
secret_partition: provider-credentials
terraform_source:
  - tako0614/takoform
  - registry.opentofu.org/tako0614/takoform
  - registry.terraform.io/tako0614/takoform
env_names:
  - TAKOFORM_ENDPOINT
  - TAKOFORM_SPACE
  - TAKOFORM_TOKEN
required_env_groups:
  - [TAKOFORM_TOKEN]
renewable_env_capability:
  source_env_name: TAKOFORM_TOKEN
  file_env_name: TAKOFORM_TOKEN_FILE
  minimum_provider_version: 4.1.0
auth_modes:
  token:
    runtime_inputs:
      contract: takosumi.provider-runtime-inputs/v1
      nonce_argument: runtime_input_nonce
      map_argument: runtime_inputs
      # These arguments belong to Provider 4.x, starting at 4.0.0. A different
      # major does not inherit this protocol. Core keeps unproven wiring inert
      # instead of baking unsupported arguments into a reviewed root.
      minimum_provider_version: 4.0.0
    env:
      TAKOFORM_TOKEN:
        from: secret
        name: token
      TAKOFORM_ENDPOINT:
        from: value
        name: endpoint
      TAKOFORM_SPACE:
        from: value
        name: space
